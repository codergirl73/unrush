<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>Unrush title</title>
<style>
  :root { --brand: #4f46e5; --violet: #7c3aed; --teal: #14b8a6; }
  * { box-sizing: border-box; margin: 0; }
  html, body { width: 1920px; height: 1080px; overflow: hidden; }
  body {
    font-family: "Inter", ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
    color: white; display: grid; place-items: center;
    background: radial-gradient(1200px 700px at 20% 10%, rgba(124, 58, 237, 0.55), transparent 60%),
      radial-gradient(1000px 700px at 90% 90%, rgba(20, 184, 166, 0.45), transparent 60%), #0b0f1d;
  }
  .wrap { text-align: center; animation: rise 1.1s cubic-bezier(0.2, 0.9, 0.3, 1) both; }
  .logo { width: 132px; height: 132px; margin: 0 auto 34px; display: block; animation: spin 2.2s ease-out both; }
  h1 { font-size: 132px; font-weight: 800; letter-spacing: -0.04em; line-height: 1; }
  .tag { margin-top: 26px; font-size: 44px; font-weight: 500; color: rgba(255, 255, 255, 0.88); letter-spacing: -0.01em; animation: rise 1.1s 0.35s both; }
  .sub { margin-top: 18px; font-size: 26px; color: rgba(255, 255, 255, 0.6); animation: rise 1.1s 0.55s both; }
  .chips { margin-top: 64px; display: flex; gap: 14px; justify-content: center; flex-wrap: wrap; animation: rise 1.1s 0.8s both; }
  .chip { font-size: 22px; font-weight: 600; padding: 12px 22px; border-radius: 999px; background: rgba(255, 255, 255, 0.08); border: 1px solid rgba(255, 255, 255, 0.18); }
  @keyframes rise { from { opacity: 0; transform: translateY(26px); } to { opacity: 1; transform: none; } }
  @keyframes spin { from { opacity: 0; transform: rotate(-90deg) scale(0.6); } to { opacity: 1; transform: none; } }
</style>
</head>
<body>
  <div class="wrap">
    <svg class="logo" viewBox="0 0 32 32" aria-hidden="true">
      <circle cx="14" cy="16" r="11" fill="none" stroke="#a5b4fc" stroke-width="2.6" />
      <path d="M14 10v6l4 3M24 9l5 3-5 3" fill="none" stroke="#2dd4bf" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" />
    </svg>
    <h1>Unrush</h1>
    <div class="tag">The assistant that speaks first, before your evening falls apart.</div>
    <div class="sub">A proactive household assistant · a simulated Alexa+ experience</div>
    <div class="chips">
      <span class="chip">Amazon Bedrock · Nova 2 Lite</span>
      <span class="chip">AgentCore Memory</span>
      <span class="chip">MCP 2025-11-25 · Streamable HTTP</span>
      <span class="chip">MCP Apps</span>
      <span class="chip">Agent Skills</span>
    </div>
  </div>
</body>
</html>
